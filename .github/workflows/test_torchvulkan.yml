name: torchvulkan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Py${{ matrix.python-version }} / ${{ matrix.torch-factor }}
    runs-on: ${{ matrix.os }}
    env:
      SKBUILD_CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
        torch-factor: ["torch210", "torch213"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain (Slang, Vulkan, spirv-cross)
        uses: ./.github/actions/setup-toolchain

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run Tests via Tox
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          SKBUILD_CMAKE_GENERATOR: Ninja
          MVK_CONFIG_LOG_LEVEL: 3
          VK_LOADER_DEBUG: all
          MKL_ENABLE_INSTRUCTIONS: AVX2   # avoid AVX-512 GEMM path that faults on some GHA runner CPUs
          ATEN_CPU_CAPABILITY: avx2       # same clamp for PyTorch's own vectorized kernels
        run: |
          tox -e py-${{ matrix.torch-factor }}

  testing-success:
    name: testing success
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs passed
        if: needs.build-and-test.result != 'success'
        run: |
          echo "build-and-test result: ${{ needs.build-and-test.result }}"
          exit 1
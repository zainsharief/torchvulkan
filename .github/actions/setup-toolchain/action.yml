name: Setup torchvulkan toolchain
description: >
  Install the build/runtime toolchain for the current runner OS: the Slang
  compiler, a Vulkan driver + SDK headers, and spirv-cross. Exports the needed
  PATH / env entries so later steps in the job can build and run torchvulkan.

inputs:
  slang-version:
    description: Slang release version to install.
    default: "2026.8.1"
  vulkan-sdk-version:
    description: Vulkan SDK version (Windows only).
    default: "1.3.296.0"

runs:
  using: composite
  steps:
    - name: Resolve Slang arch
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)    echo "SLANG_ARCH=linux-x86_64"   >> "$GITHUB_ENV" ;;
          macOS-ARM64)  echo "SLANG_ARCH=macos-aarch64"  >> "$GITHUB_ENV" ;;
          macOS-X64)    echo "SLANG_ARCH=macos-x86_64"   >> "$GITHUB_ENV" ;;
          Windows-X64)  echo "SLANG_ARCH=windows-x86_64" >> "$GITHUB_ENV" ;;
          *) echo "::error::Unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac

    - name: Install Slang (macOS & Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -L -o slang.zip "https://github.com/shader-slang/slang/releases/download/v${{ inputs.slang-version }}/slang-${{ inputs.slang-version }}-${SLANG_ARCH}.zip"
        unzip slang.zip -d "$RUNNER_TEMP/slang"
        echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
        echo "SLANG_DIR=$RUNNER_TEMP/slang/bin" >> "$GITHUB_ENV"

    - name: Install Slang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = "slang-${{ inputs.slang-version }}-$env:SLANG_ARCH.zip"
        Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v${{ inputs.slang-version }}/$zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath C:\slang
        "C:\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        "SLANG_DIR=C:\slang\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Install Vulkan (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list http://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk mesa-vulkan-drivers
        vulkaninfo --summary

    - name: Install Vulkan (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install molten-vk vulkan-tools ninja libxshmfence spirv-cross
        MVK_ICD=$(find $(brew --prefix)/share $(brew --prefix)/etc $(brew --prefix molten-vk) -name "MoltenVK_icd.json" 2>/dev/null | head -n 1)
        echo "VK_ICD_FILENAMES=$MVK_ICD" >> "$GITHUB_ENV"
        echo "MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
        export VK_ICD_FILENAMES="$MVK_ICD"
        export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
        export DYLD_LIBRARY_PATH="$(brew --prefix)/lib:$DYLD_LIBRARY_PATH"
        vulkaninfo --summary

    - name: Install Vulkan (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/23.3.2/mesa3d-23.3.2-release-msvc.7z" -OutFile "mesa.7z"
        7z x mesa.7z -omesa -y | Out-Null

        $lvpJson = (Resolve-Path "mesa\x64\lvp_icd.x86_64.json").Path
        $driverKey = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
        if (!(Test-Path $driverKey)) { New-Item -Path $driverKey -Force | Out-Null }
        New-ItemProperty -Path $driverKey -Name $lvpJson -PropertyType DWord -Value 0 -Force | Out-Null

        $sdkVersion = "${{ inputs.vulkan-sdk-version }}"
        $installer = "VulkanSDK-$sdkVersion-Installer.exe"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/$installer" -OutFile $installer
        Start-Process -FilePath ".\$installer" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

        "VULKAN_SDK=C:\VulkanSDK\$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        "C:\VulkanSDK\$sdkVersion\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

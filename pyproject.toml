[build-system]
requires = ["torch", "scikit-build-core", "setuptools_scm"]
build-backend = "scikit_build_core.build"

[project]
name = "torchvulkan"
dynamic = ["version"]
dependencies = ["torch==2.13.0"]

[tool.scikit-build]
editable.mode = "redirect"
build-dir = "build/{wheel_tag}"
wheel.packages = ["torchvulkan"]
cmake.build-type = "Release"

metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["torchvulkan/_version.py"] 

[tool.setuptools_scm]
write_to = "torchvulkan/_version.py"

[project.optional-dependencies]
test = ["pytest", "tox"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *_i686 *-win32"
test-command = 'python -c "import torchvulkan; print(torchvulkan.__version__)"'
test-requires = "torch==2.13.0"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
before-all = "bash .github/scripts/install-toolchain-linux.sh"
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TORCHVULKAN"]
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu", VULKAN_SDK = "/opt/vulkan/x86_64", SLANG_DIR = "/opt/slang/bin", PATH = "/opt/vulkan/x86_64/bin:/opt/slang/bin:$PATH" }
repair-wheel-command = "auditwheel repair --exclude libtorch.so --exclude libtorch_cpu.so --exclude libtorch_python.so --exclude libtorch_global_deps.so --exclude libc10.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu", MACOSX_DEPLOYMENT_TARGET = "14.0" }
repair-wheel-command = ""

[tool.cibuildwheel.windows]
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
repair-wheel-command = ""